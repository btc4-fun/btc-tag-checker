name: btc4fun — Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Build with the existing user signing key (fails if missing)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests-lint-debug:
    name: Tests, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          validate-wrappers: true
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - name: Independent Python contracts and bundled content
        run: |
          mkdir -p build/reports
          python3 -m pip install 'jinja2==3.1.6'
          python3 tools/sync_public_content.py --check
          python3 -m unittest discover -s tests -v 2>&1 | tee build/reports/python-tests.txt
      - name: Tests, strict lint and debug build
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --dependency-verification strict --no-daemon --rerun-tasks --console=plain
      - name: Exercise native callbacks, expiry and contact consent
        run: |
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/customer-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd --force --name customer-checks --package 'system-images;android-35;google_apis;x86_64'
          test -s "$ANDROID_AVD_HOME/customer-checks.ini"
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd customer-checks -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -port 5554 > build/reports/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'adb -s emulator-5554 emu kill || true; kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 180 bash -c 'until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
          ./gradlew :app:assembleDebugAndroidTest --dependency-verification strict --no-daemon --no-parallel --max-workers=1 --console=plain
          python3 tools/run_device_checks.py --serial emulator-5554 | tee build/reports/device-tests.txt
          python3 tools/verify_window_policy.py --serial emulator-5554 | tee build/reports/window-policy.txt
      - name: Validate debug artifact
        run: python3 tools/verify_apk.py debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: btc4fun-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/btc4fun-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: btc4fun-reports-${{ github.sha }}
          path: |
            build/reports/
            core/build/reports/
            core/build/test-results/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: error
          retention-days: 14

  signed-release:
    name: Verified signed APK and tag release
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.signed_release) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: write
    concurrency:
      group: signed-release-${{ github.ref }}
      cancel-in-progress: false
    needs: tests-lint-debug
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Admit trusted release event before secrets
        env:
          SIGNED_RELEASE: ${{ inputs.signed_release }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 tools/release_guard.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          validate-wrappers: true
          cache-disabled: true
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - name: Sign with the existing user key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export ANDROID_RELEASE_KEYSTORE="$RUNNER_TEMP/btc-tag-checker-release.jks"
          cleanup() { rm -f -- "$ANDROID_RELEASE_KEYSTORE"; }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          python3 - <<'PY'
          import base64, os, sys
          names = ('ANDROID_RELEASE_KEYSTORE_BASE64', 'ANDROID_RELEASE_STORE_PASSWORD', 'ANDROID_RELEASE_KEY_ALIAS', 'ANDROID_RELEASE_KEY_PASSWORD')
          if any(not os.environ.get(name, '').strip() for name in names):
              sys.exit('Signed release requested but signing secrets are missing. No key will be generated.')
          try:
              data = base64.b64decode(os.environ['ANDROID_RELEASE_KEYSTORE_BASE64'], validate=True)
              if not data:
                  raise ValueError()
              fd = os.open(os.environ['ANDROID_RELEASE_KEYSTORE'], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, 'wb') as stream:
                  stream.write(data)
          except Exception:
              sys.exit('Could not prepare the supplied signing keystore.')
          PY
          unset ANDROID_RELEASE_KEYSTORE_BASE64
          ./gradlew :core:test :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --dependency-verification strict --no-daemon --rerun-tasks --console=plain
      - name: Always remove temporary signing file
        if: always()
        run: rm -f -- "$RUNNER_TEMP/btc-tag-checker-release.jks"
      - name: Validate release and match approved shared signer
        env:
          EXPECTED_RELEASE_CERT_SHA256: 7c4ccefc998b2407b22c2a7a3bc97e9b5f9baca3089886a5e71dcfef85b0fa3b
        run: python3 tools/verify_apk.py release
      - name: Publish verified tag release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            app/build/outputs/apk/release/btc4fun-release.apk \
            app/build/outputs/apk/release/SHA256SUMS \
            --verify-tag --title "btc4fun $RELEASE_TAG" \
            --notes-file .github/release-notes.md \
            --draft=false --prerelease=false --latest
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets,url
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: btc4fun-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/btc4fun-release.apk
            app/build/outputs/apk/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: btc4fun-release-reports-${{ github.sha }}
          path: |
            core/build/reports/
            core/build/test-results/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: error
          retention-days: 14
